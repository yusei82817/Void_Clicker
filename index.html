<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#090b16">
<title>VOID CLICKER</title>
<style>
:root{color-scheme:dark;--bg:#090b16;--panel:#12182a;--line:#273452;--cyan:#62f3ed;--violet:#9a83ff;--muted:#9aa8c4}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 25%,#1c2850 0,#0d1224 42%,var(--bg) 78%);color:#f3f6ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:20px;user-select:none;-webkit-user-select:none}
main{width:min(100%,680px);text-align:center}
.brand{font-size:clamp(12px,2vw,14px);letter-spacing:.42em;color:var(--cyan);font-weight:800}
h1{font-size:clamp(34px,8vw,62px);letter-spacing:.08em;margin:8px 0 4px;text-shadow:0 0 28px #62f3ed55}
.subtitle{color:var(--muted);margin:0 0 26px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat{background:#11182bd9;border:1px solid var(--line);border-radius:14px;padding:12px 8px}
.stat small{display:block;color:var(--muted);font-size:11px;letter-spacing:.12em}
.stat strong{display:block;font-size:clamp(22px,5vw,30px);font-variant-numeric:tabular-nums;margin-top:3px}
#score{color:var(--cyan)}#time{color:#ffcf72}
#arena{position:relative;display:grid;place-items:center;width:100%;aspect-ratio:1.45;min-height:250px;border:1px solid #3b5079;border-radius:24px;overflow:hidden;background:radial-gradient(ellipse,#263c67 0,#172440 48%,#10182c 100%);box-shadow:inset 0 0 55px #050914aa,0 18px 60px #0006;touch-action:none;cursor:crosshair}
#arena:before,#arena:after{content:"";position:absolute;inset:12px;border:1px solid #9eb5ff18;border-radius:17px;pointer-events:none}
#arena:after{inset:24px;border-color:#9eb5ff12}
#target{z-index:1;width:min(46vw,220px);height:min(46vw,220px);max-height:70%;max-width:70%;border-radius:50%;border:2px solid #9cfaf2;background:radial-gradient(circle at 35% 30%,#c5fffa 0,#58e5df 8%,#277a9c 35%,#25326f 66%,#171d45 100%);box-shadow:0 0 22px #62f3ed88,0 0 75px #4d9bff55,inset -12px -18px 35px #080d2caa;transition:transform .07s;pointer-events:none}
#target.hit{transform:scale(.91);filter:brightness(1.6)}
#hint{position:absolute;z-index:2;bottom:18px;color:#c5d2ee;font-size:12px;letter-spacing:.12em;pointer-events:none}
#overlay{position:absolute;inset:0;z-index:3;display:grid;place-content:center;gap:12px;background:#080d1bd9;backdrop-filter:blur(5px);padding:20px}
#overlay.hidden{display:none}
#overlay h2{margin:0;font-size:clamp(22px,5vw,32px)}
#overlay p{margin:0;color:#b9c6e2;font-size:14px;line-height:1.7}
button{border:0;border-radius:999px;padding:14px 30px;background:linear-gradient(100deg,var(--cyan),#9e9aff);color:#081322;font-weight:900;font-size:16px;letter-spacing:.08em;cursor:pointer;box-shadow:0 5px 24px #62f3ed44}
button:active{transform:scale(.97)}
.footer{display:flex;justify-content:space-between;gap:12px;margin-top:13px;color:var(--muted);font-size:12px}
#active{color:var(--cyan)}
@media(max-width:420px){body{padding:14px}.stat{padding:10px 4px}.footer{font-size:11px}}
</style>
</head>
<body>
<main>
 <div class="brand">YUSEI82817 PROJECT</div>
 <h1>VOID CLICKER</h1>
 <p class="subtitle">NO UPGRADES. NO MERCY. JUST YOUR FINGERS.</p>
 <section class="stats" aria-label="ゲーム状況">
  <div class="stat"><small>SCORE</small><strong id="score">0</strong></div>
  <div class="stat"><small>TIME</small><strong id="time">30.0</strong></div>
  <div class="stat"><small>BEST</small><strong id="best">0</strong></div>
 </section>
 <section id="arena" aria-label="クリックエリア">
  <div id="target"></div>
  <div id="hint">TAP / CLICK THE CORE</div>
  <div id="overlay">
   <h2 id="overlayTitle">READY?</h2>
   <p id="overlayText">30秒間、ひたすらコアを叩け。<br>スマホ・タブレットは最大8本の指を同時判定。</p>
   <button id="start">START</button>
  </div>
 </section>
 <div class="footer"><span>同時入力上限: <b>8 fingers</b></span><span>ACTIVE: <b id="active">0 / 8</b></span><span>UPGRADES: <b>NONE</b></span></div>
</main>
<script>
(()=>{
 const arena=document.getElementById('arena'),scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),bestEl=document.getElementById('best'),activeEl=document.getElementById('active'),overlay=document.getElementById('overlay'),title=document.getElementById('overlayTitle'),desc=document.getElementById('overlayText'),start=document.getElementById('start'),target=document.getElementById('target');
 let score=0,best=0,playing=false,deadline=0,raf=0;
 const activePointers=new Set(),MAX_FINGERS=8,DURATION=30000;
 try{best=Number(localStorage.getItem('void-clicker-best'))||0}catch{}
 bestEl.textContent=best;
 function refreshActive(){activeEl.textContent=activePointers.size+' / '+MAX_FINGERS}
 function finish(){playing=false;cancelAnimationFrame(raf);activePointers.clear();refreshActive();timeEl.textContent='0.0';title.textContent='TIME UP';desc.innerHTML='SCORE: <b>'+score.toLocaleString()+'</b><br>'+(score>best?'NEW RECORD.':'もう一度、記録を更新しろ。');start.textContent='RETRY';overlay.classList.remove('hidden')}
 function tick(){if(!playing)return;const left=Math.max(0,deadline-performance.now());timeEl.textContent=(left/1000).toFixed(1);if(left<=0){finish();return}raf=requestAnimationFrame(tick)}
 function begin(){score=0;scoreEl.textContent='0';timeEl.textContent='30.0';activePointers.clear();refreshActive();playing=true;deadline=performance.now()+DURATION;overlay.classList.add('hidden');tick()}
 start.addEventListener('click',begin);
 arena.addEventListener('pointerdown',e=>{
  if(!playing||e.target===start)return;
  if(activePointers.has(e.pointerId))return;
  if(activePointers.size>=MAX_FINGERS)return;
  activePointers.add(e.pointerId);refreshActive();
  score++;scoreEl.textContent=score.toLocaleString();
  target.classList.add('hit');setTimeout(()=>target.classList.remove('hit'),65);
  try{arena.setPointerCapture(e.pointerId)}catch{}
 });
 function release(e){if(activePointers.delete(e.pointerId))refreshActive()}
 arena.addEventListener('pointerup',release);arena.addEventListener('pointercancel',release);arena.addEventListener('lostpointercapture',release);
 window.addEventListener('blur',()=>{activePointers.clear();refreshActive()});
 const observer=new MutationObserver(()=>{if(!playing&&title.textContent==='TIME UP'&&score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('void-clicker-best',String(best))}catch{}}});
 observer.observe(title,{childList:true});
})();
</script>
</body>
</html>
